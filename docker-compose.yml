version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mr_construcao_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mr_construcao
    ports:
      - '5432:5432'
    volumes:
      - mr_construcao_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  mr_construcao_pgdata:
