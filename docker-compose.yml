services:
  api-mr-construcao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-mr-construcao-web
    restart: always
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: mr_construcao_secret_key_super_segura_tecinfo_2026
      CORS_ORIGIN: "*"
      DATABASE_URL: "postgresql://mr_user:mr_pass_2026_prod@api-mr-construcao-db:5432/mr_construcao_prod?schema=public"
    depends_on:
      api-mr-construcao-db:
        condition: service_healthy
    networks:
      - mr-network

  api-mr-construcao-db:
    image: postgres:16-alpine
    container_name: api-mr-construcao-db
    restart: always
    environment:
      POSTGRES_USER: mr_user
      POSTGRES_PASSWORD: mr_pass_2026_prod
      POSTGRES_DB: mr_construcao_prod
    volumes:
      - mr_construcao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr_user -d mr_construcao_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mr-network

volumes:
  mr_construcao_pgdata:

networks:
  mr-network:
    driver: bridge
